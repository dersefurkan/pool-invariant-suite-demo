name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge version
        run: forge --version
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --skip test
      - name: Test
        run: forge test -vv
